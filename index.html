<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ScanFix — CamScanner Watermark Remover &amp; ID Card Splitter</title>
  <meta name="description" content="100% client-side tool: upload PDF / JPG / PNG scans, strip the 'Scanned with CamScanner' footer, split ID card front & back halves, and export a single PDF or individual PNGs." />
  <link rel="stylesheet" href="styles.css" />

  <!-- React (UMD) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
  <!-- JSX compiler (runtime, no build step) -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
  <!-- PDF engine: render PDF pages to canvas -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- PDF writer: build the merged output PDF -->
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- App source is fetched at runtime and compiled in the browser by Babel -->
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
